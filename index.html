<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syllabuzz Dashboard</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#14152a;--mut:#6a6f8a;--line:#e6e8f2;--ac:#5b5bf0;--ok:#16a34a;--bad:#ef4444;--warn:#d97706;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b0c14;--card:#141624;--tx:#eef0ff;--mut:#9094b3;--line:#232640;--ac:#818cf8;color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}button.d{background:var(--bad)}button.s{padding:4px 10px;font-size:.82rem;border-radius:8px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);border-color:var(--ac)}
input[type=color]{padding:2px;height:38px}input[type=checkbox]{width:auto}input[type=range]{padding:0;accent-color:var(--ac)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:.9rem;margin:12px 0 0}
textarea{min-height:90px;font-family:inherit}textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;min-height:260px}
.help{font-size:.76rem;color:var(--mut);margin:3px 0 0}
/* login */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--ac);border-right-color:transparent;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#login{min-height:100vh;min-height:100dvh;display:flex}
.hero{display:none;flex:1;max-width:620px;color:#fff;padding:56px;background:linear-gradient(145deg,#4f46e5,#7c3aed 55%,#c026d3);flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#fff;opacity:.09;right:-140px;top:-120px}
.hero>*{position:relative}.hero h2{font-size:2.1rem;line-height:1.15;margin:0 0 12px}.hero p{opacity:.88;margin:0;max-width:34ch}
.lp{flex:1;display:grid;place-items:center;padding:24px 18px}
.box{width:min(100%,400px)}.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem;margin-bottom:22px}.logo svg{width:40px;height:40px}
.box h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}.mut{color:var(--mut)}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin:8px 0}
.gbtn{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;background:#fff;color:#3c4043;border:1px solid #dadce0;padding:12px;min-height:46px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.8rem;margin:16px 0 4px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.pri{width:100%;min-height:46px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
@media(min-width:900px){.hero{display:flex}}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
nav h2{margin:0 8px 12px;font-size:1.1rem}nav button{text-align:left;background:none;color:var(--tx);font-weight:500;display:flex;align-items:center;gap:9px;padding:9px 10px}
nav button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:700}
nav .sp{flex:1}nav small{margin:4px 8px;color:var(--mut);word-break:break-all}
.bdg{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px}
main{padding:22px;max-width:1120px;width:100%}
h3{margin:0 0 12px;font-size:1.15rem}h4{margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card b{display:block;font-size:1.6rem}.card span{color:var(--mut);font-size:.82rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td.w{white-space:normal;min-width:200px}
th{color:var(--mut);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}tr.row{cursor:pointer}tr.row:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.tag.off{background:var(--line);color:var(--mut)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar input,.bar select{width:auto;flex:1;min-width:150px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}.chart div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div i{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:.7rem;font-style:normal;color:var(--mut)}
.lab{display:flex;gap:5px;font-size:.68rem;color:var(--mut)}.lab span{flex:1;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--line)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.head .av{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem;overflow:hidden}.head .av img{width:100%;height:100%;object-fit:cover}
.head .grow{flex:1;min-width:200px}.head h3{margin:0}.acts{display:flex;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item .em{font-size:1.5rem;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--ac) 12%,transparent);flex:none}
.item .tx{flex:1;min-width:0}.item .tx p{margin:3px 0 0;color:var(--mut);font-size:.86rem;white-space:pre-wrap;word-break:break-word}
.sw{position:relative;width:42px;height:24px;flex:none;display:inline-block}.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s;cursor:pointer}.sw i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{transform:translateX(18px)}
.pv{border-radius:14px;color:#fff;padding:12px 14px;margin-top:12px}.pv b{display:block}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);width:min(94vw,480px);padding:20px;max-height:92vh;overflow:auto}
dialog::backdrop{background:#0009}.dacts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.88rem;z-index:99;display:none;max-width:90vw}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:0}.item{flex-wrap:wrap}.item .tx{flex:1 1 calc(100% - 60px)}.item .acts{width:100%;padding-left:54px}nav{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;overflow-x:auto;align-items:center;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
 nav h2,nav .sp,nav small{display:none}nav button{white-space:nowrap;flex:none}main{padding:14px}.two{grid-template-columns:1fr}}
</style></head>
<body>
<div id="boot"><div class="spin"></div></div>
<div id="login" hidden>
 <aside class="hero"><div class="logo"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#ffffff33"/><path d="M24 11c-5.5 0-9 4-9 9.5V27l-2.5 3.5h23L33 27v-6.5C33 15 29.5 11 24 11z" fill="#fff"/><path d="M20.5 34a3.5 3.5 0 007 0z" fill="#fff"/></svg>Syllabuzz</div>
  <div><h2>Run Syllabuzz<br>from one place.</h2><p>Users, announcements, feature switches, resources and feedback. No code changes needed.</p></div><small style="opacity:.7">Admin dashboard</small></aside>
 <div class="lp"><div class="box">
  <div class="logo" style="color:var(--tx)"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#7061f2"/><path d="M24 11c-5.5 0-9 4-9 9.5V27l-2.5 3.5h23L33 27v-6.5C33 15 29.5 11 24 11z" fill="#fff"/><path d="M20.5 34a3.5 3.5 0 007 0z" fill="#fff"/></svg>Syllabuzz</div>
  <h1>Admin sign in</h1><p class="mut" style="margin:0 0 18px">Only approved admins can continue.</p>
  <button class="gbtn" id="lG"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 010-9.4l-7.9-6.1a24 24 0 000 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
  <div class="or">or with email</div>
  <form id="lF"><label for="lE">Email</label><input id="lE" type="email" autocomplete="email" required><label for="lP">Password</label><input id="lP" type="password" autocomplete="current-password" required>
  <p class="err" id="lM" role="status"></p><button class="pri" id="lGo" type="submit">Log in</button></form>
 </div></div>
</div>
<div id="app" hidden>
<nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp,deleteApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut,createUserWithEmailAndPassword,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,collectionGroup,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,deleteField,onSnapshot,writeBatch,serverTimestamp,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const cfg=window.SB_CONFIG.firebase,$=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(/^YOUR_/.test(cfg.apiKey)){document.body.innerHTML='<p style="padding:24px">Fill in <code>firebase-config.js</code> first.</p>';throw 0}
const app=initializeApp(cfg,'dashboard'),auth=getAuth(app),db=getFirestore(app);
const KEYS={tt:'Classes',tth:'Holidays',tta:'Attendance marks',ttsem:'Term dates',tas:'Assignments',ttl:'Lecturer contacts',ttk:'Look and theme',ttf:'Preferences',tsh:'Study hub'};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],COLORS=['#4f46e5','#0d9488','#d97706','#dc2626','#9333ea','#2563eb'];
const KIND={info:'#6366f1',success:'#16a34a',warning:'#d97706',urgent:'#dc2626',promo:'#c026d3'};
/* built-in feature switches the app already understands (more can be added from the Features page) */
const BUILTIN=[['tab_week','Week tab','Weekly grid view in the bottom bar'],['tab_stats','Stats tab','Attendance statistics tab'],['tab_tasks','Tasks tab','Assignments tab'],['tab_study','Study tab','Flashcards and notes tab'],
 ['feat_notices','Notices','Announcements and messages screen in Settings'],['feat_resources','Campus resources','Resources screen in Settings'],['feat_feedback','Send feedback','Feedback form in Settings'],['feat_tips','Tip of the day','Daily tip card on the home screen']];
const S={users:[],ann:[],content:[],fb:[],admins:[],log:[],flags:{},cfg:{}};
let route='overview',unsubs=[],unD=null,sel=null,tab='classes',udata={},gstats=null,q='',fPlat='',fStat='',fRole='',fbF='new',cTab='resource',me=null,loginNote='';
const date=t=>t&&t.toDate?t.toDate():(typeof t==='number'&&t?new Date(t):null);
const ago=d=>{if(!d)return'never';const s=(Date.now()-d)/1000;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';if(s<86400*30)return Math.round(s/86400)+' d ago';return d.toLocaleDateString()};
const day=d=>d?d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'-';
const dt=d=>d?d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'-';
const dtl=ms=>{if(!ms)return'';const d=new Date(ms),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tag=(t,c)=>'<span class="tag'+(c?' '+c:'')+'">'+esc(t)+'</span>';
const sw=(on,attrs)=>'<label class="sw"><input type="checkbox"'+(on?' checked':'')+' '+attrs+'><i></i></label>';
function parse(k){const x=udata[k];if(!x)return null;try{return JSON.parse(x.v)}catch(e){return null}}
async function put(uid,k,val){await setDoc(doc(db,'users',uid,'data',k),{v:typeof val==='string'?val:JSON.stringify(val),u:serverTimestamp(),by:'dashboard'})}
async function logA(action,detail){try{await addDoc(collection(db,'adminLog'),{by:me?me.email:'?',action,detail:String(detail||'').slice(0,300),createdAt:serverTimestamp()})}catch(e){}}
const cfgSet=(o)=>setDoc(doc(db,'config','app'),o,{merge:true});

/* ---------- login ---------- */
const lmsg=t=>{$('lM').textContent=t||''};
$('lF').onsubmit=async e=>{e.preventDefault();lmsg('');$('lGo').disabled=true;try{await signInWithEmailAndPassword(auth,$('lE').value.trim(),$('lP').value)}catch(x){lmsg(['auth/too-many-requests'].includes(x.code)?'Too many attempts. Wait a bit.':'Wrong email or password.')}$('lGo').disabled=false};
$('lG').onclick=async()=>{lmsg('');try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')lmsg(e.code==='auth/unauthorized-domain'?'This domain is not authorised in Firebase (Authentication > Settings > Authorized domains).':e.code==='auth/popup-blocked'?'Allow pop-ups for this page and try again.':(e.code||'Sign-in failed'))}};
function showLogin(){$('boot').hidden=true;$('app').hidden=true;$('login').hidden=false;lmsg('');if(loginNote){$('lM').innerHTML=loginNote;loginNote=''}}
function stopAll(){unsubs.forEach(u=>u());unsubs=[];if(unD){unD();unD=null}}
let outT=null;
onAuthStateChanged(auth,async u=>{
  clearTimeout(outT);stopAll();
  if(!u){outT=setTimeout(()=>{if(!auth.currentUser){me=null;showLogin()}},350);return}
  let ok=false;try{ok=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){}
  if(!ok){loginNote='Not an admin. In Firestore create document <b>admins/'+esc(u.uid)+'</b> (any field), then log in again.';await signOut(auth);return}
  me={uid:u.uid,email:u.email||u.displayName||u.uid};
  $('boot').hidden=true;$('login').hidden=true;$('app').hidden=false;
  const L=(c,k,f)=>unsubs.push(onSnapshot(c,s=>{S[k]=f?f(s):s.docs.map(d=>Object.assign({id:d.id},d.data()));draw(true)},e=>{if(e.code!=='permission-denied')toast('Could not load '+k+': '+e.code);else console.warn('rules not updated for',k)}));
  L(collection(db,'users'),'users');L(collection(db,'announcements'),'ann');L(collection(db,'content'),'content');L(collection(db,'feedback'),'fb');L(collection(db,'admins'),'admins');
  L(query(collection(db,'adminLog'),orderBy('createdAt','desc'),limit(100)),'log');
  L(doc(db,'config','flags'),'flags',s=>(s.exists()&&s.data().items)||{});L(doc(db,'config','app'),'cfg',s=>s.exists()?s.data():{});
  draw();
});
$('nav').onclick=e=>{const b=e.target.closest('[data-r]');if(b){route=b.dataset.r;closeUser();draw()}if(e.target.id==='out')signOut(auth)};

/* ---------- shell ---------- */
const NAV=[['overview','Overview','📊'],['users','Users','👥'],['ann','Announcements','📣'],['flags','Features','🎚'],['control','App control','⚙'],['content','Content','🗂'],['fb','Feedback','💬'],['bc','Broadcast','📤'],['admins','Admins','🔑'],['log','Activity','🗒']];
function drawNav(){const nf=S.fb.filter(f=>(f.status||'new')==='new').length;
  $('nav').innerHTML='<h2>Syllabuzz</h2>'+NAV.map(n=>'<button data-r="'+n[0]+'" class="'+(route===n[0]?'on':'')+'"><span>'+n[2]+'</span>'+n[1]+(n[0]==='fb'&&nf?'<span class="bdg">'+nf+'</span>':'')+'</button>').join('')+'<div class="sp"></div><small>'+esc(me?me.email:'')+'</small><button id="out">Log out</button>'}
const VIEWS={overview:overviewHtml,users:usersHtml,ann:annHtml,flags:flagsHtml,control:controlHtml,content:contentHtml,fb:fbHtml,bc:bcHtml,admins:adminsHtml,log:logHtml};
function draw(snap){
  if(!me)return;drawNav();
  if(sel)return drawUser();
  if(snap&&(route==='control'||route==='bc'))return;      /* do not wipe what is being typed */
  const m=$('main'),ae=document.activeElement,id=ae&&m.contains(ae)?ae.id:'',pos=id&&ae.selectionStart!=null?ae.selectionStart:null;
  m.innerHTML=VIEWS[route]();
  if(id&&$(id)){$(id).focus();if(pos!=null)try{$(id).setSelectionRange(pos,pos)}catch(e){}}
}
const A={},C={};
$('main').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset,el,e)});
$('main').addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el.dataset,el)});
$('main').addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el&&C[el.dataset.i])C[el.dataset.i](el.dataset,el)});

/* ---------- generic form dialog ---------- */
function form(title,fields,v,onSave,o){o=typeof o==='string'?{btn:o}:(o||{});
  const inp=f=>{const id='ff_'+f.k,val=v[f.k];
    if(f.t==='textarea')return'<textarea id="'+id+'" placeholder="'+esc(f.ph||'')+'">'+esc(val||'')+'</textarea>';
    if(f.t==='select')return'<select id="'+id+'">'+f.o.map(x=>'<option value="'+esc(x[0])+'"'+(String(val)===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select>';
    if(f.t==='check')return'<label class="ck"><input id="'+id+'" type="checkbox"'+(val?' checked':'')+'> '+esc(f.l)+'</label>';
    if(f.t==='datetime')return'<input id="'+id+'" type="datetime-local" value="'+dtl(val)+'">';
    return'<input id="'+id+'" type="'+(f.t||'text')+'" value="'+esc(val==null?'':val)+'" placeholder="'+esc(f.ph||'')+'">'};
  const one=f=>(f.t==='check'?'':'<label for="ff_'+f.k+'">'+esc(f.l)+'</label>')+inp(f)+(f.h?'<p class="help">'+esc(f.h)+'</p>':'');
  let h='<h3>'+esc(title)+'</h3>',i=0;
  while(i<fields.length){const f=fields[i];if(f.half&&fields[i+1]&&fields[i+1].half){h+='<div class="two"><div>'+one(f)+'</div><div>'+one(fields[i+1])+'</div></div>';i+=2}else{h+=one(f);i++}}
  dlg(h+(o.preview?'<div id="pv"></div>':''),async()=>{const r={};

  return'<h3>Announcements</h3><p class="mut" style="margin-top:-6px">Banners and pop-ups shown inside the app. Schedule them, target a platform or a role, and switch them off any time.</p><div class="bar"><button data-a="annNew">+ New announcement</button></div>'+
   '<div class="panel">'+(L.map(a=>{const st=annState(a),c={live:'ok',scheduled:'warn',expired:'off',off:'off'}[st];
    return'<div class="item"><div class="em" style="background:'+(KIND[a.kind]||KIND.info)+'33">'+({success:'✅',warning:'⚠',urgent:'🚨',promo:'🎉'}[a.kind]||'📣')+'</div><div class="tx"><b>'+esc(a.title)+'</b> '+tag(st,c)+' '+tag(a.style==='popup'?'Pop-up':'Banner')+' '+tag('For '+(a.audience==='role'?'role: '+(a.role||'?'):(a.audience||'all')))+(a.pin?' '+tag('Pinned'):'')+

const annFields=[{k:'title',l:'Title',req:1},{k:'body',l:'Message',t:'textarea'},{k:'kind',l:'Look',t:'select',o:[['info','Info (indigo)'],['success','Good news (green)'],['warning','Heads up (amber)'],['urgent','Urgent (red)'],['promo','Promo (purple)']],half:1},{k:'style',l:'Shown as',t:'select',o:[['banner','Banner on home screen'],['popup','Pop-up (once)']],half:1},
 {k:'audience',l:'Who sees it',t:'select',o:[['all','Everyone'],['android','Android app only'],['web','Web app only'],['role','Users with a role']],half:1},{k:'role',l:'Role (if above is "role")',half:1,ph:'tester'},

 {k:'minVersion',l:'Only app versions from',ph:'3.2',half:1},{k:'maxVersion',l:'...up to',ph:'',half:1},{k:'dismissible',l:'Users can dismiss it',t:'check'},{k:'pin',l:'Pin to the top',t:'check'},{k:'active',l:'Active',t:'check'}];
function annSave(id){return async r=>{if(r.link&&!/^https?:\/\//i.test(r.link))return'The link must start with https://';if(r.endsAt&&r.startsAt&&r.endsAt<=r.startsAt)return'End must be after start.';
  const ref=id?doc(db,'announcements',id):doc(collection(db,'announcements'));const o=Object.assign({},r);if(!id)o.createdAt=serverTimestamp();o.by=me.email;await setDoc(ref,o,{merge:true});logA(id?'Edited announcement':'Created announcement',r.title);toast('Saved')}}
A.annNew=()=>form('New announcement',annFields,{kind:'info',style:'banner',audience:'all',dismissible:true,active:true},annSave(),{preview:1,btn:'Publish'});
A.annEdit=d=>form('Edit announcement',annFields,S.ann.find(a=>a.id===d.id),annSave(d.id),{preview:1});

/* ---------- feature switches ---------- */
function flagRows(){const keys=new Set(BUILTIN.map(b=>b[0]));const rows=BUILTIN.map(b=>({k:b[0],label:b[1],desc:b[2],builtin:1}));
  Object.keys(S.flags).forEach(k=>{if(!keys.has(k))rows.push({k,label:S.flags[k].label||k,desc:S.flags[k].desc||'',builtin:0})});return rows}
function flagsHtml(){
  return'<h3>Feature switches</h3><p class="mut" style="margin-top:-6px">Turn parts of the app on or off for everyone, a platform, or a percentage of users, instantly. Changes reach open apps within seconds.</p><div class="bar"><button data-a="flagNew">+ New custom switch</button></div>'+
   '<div class="panel">'+flagRows().map(r=>{const f=S.flags[r.k]||{},on=f.on!==false;
    return'<div class="item"><div class="tx"><b>'+esc(r.label)+'</b> <span class="mut" style="font-size:.78rem">'+esc(r.k)+'</span>'+(r.builtin?'':' '+tag('custom'))+'<p>'+esc(r.desc)+'</p>'+
     '<div class="bar" style="margin:8px 0 0"><select data-c="flagPlat" data-k="'+esc(r.k)+'" style="max-width:150px"><option value="all"'+((f.platform||'all')==='all'?' selected':'')+'>All platforms</option><option value="android"'+(f.platform==='android'?' selected':'')+'>Android only</option><option value="web"'+(f.platform==='web'?' selected':'')+'>Web only</option></select>'+
     '<label style="margin:0;display:flex;align-items:center;gap:8px;flex:1;min-width:200px">Rollout <input type="range" min="0" max="100" step="5" value="'+(f.rollout==null?100:f.rollout)+'" data-c="flagRoll" data-k="'+esc(r.k)+'" data-i="flagRollLbl"> <b id="rl_'+esc(r.k)+'">'+(f.rollout==null?100:f.rollout)+'%</b></label></div></div>'+
     '<div class="acts">'+sw(on,'data-c="flagOn" data-k="'+esc(r.k)+'"')+(r.builtin?'':'<button class="d s" data-a="flagDel" data-k="'+esc(r.k)+'">Delete</button>')+'</div></div>'}).join('')+'</div>'+
   '<div class="panel"><b>Using a custom switch in the app</b><p class="mut" style="margin:6px 0 0">Add <code>data-flag="your_key"</code> to any element and it shows only while the switch is on, or call <code>SBFlag(\'your_key\')</code> in code. The page also gets the class <code>sbf-off-your_key</code> when it is off.</p></div>'}
const flagSave=(k,patch)=>setDoc(doc(db,'config','flags'),{items:{[k]:patch}},{merge:true}).then(()=>logA('Feature switch',k+' '+JSON.stringify(patch)));
C.flagOn=(d,el)=>flagSave(d.k,{on:el.checked});C.flagPlat=(d,el)=>flagSave(d.k,{platform:el.value});
C.flagRoll=(d,el)=>flagSave(d.k,{rollout:+el.value});C.flagRollLbl=(d,el)=>{const l=$('rl_'+d.k);if(l)l.textContent=el.value+'%'};
A.flagNew=()=>form('New custom switch',[{k:'k',l:'Key (letters, numbers, underscore)',req:1,ph:'dark_study_mode'},{k:'label',l:'Name',req:1},{k:'desc',l:'What it controls',t:'textarea'}],{},async r=>{
  if(!/^[a-z][a-z0-9_]{1,40}$/.test(r.k))return'Key: lowercase letters, numbers and underscore, starting with a letter.';await flagSave(r.k,{on:true,platform:'all',rollout:100,label:r.label,desc:r.desc,custom:true})},'Create');
A.flagDel=async d=>{if(!confirm('Delete this switch? Anything using it falls back to "on".'))return;await updateDoc(doc(db,'config','flags'),{['items.'+d.k]:deleteField()});logA('Deleted switch',d.k)};

   '<div class="panel"><h4>Support contact</h4><p class="mut" style="margin:0">Shown in the app’s feedback screen.</p><div class="two"><div><label>Support email</label><input id="s_e" type="email" value="'+esc(su.email||'')+'"></div><div><label>WhatsApp number (with country code)</label><input id="s_w" value="'+esc(su.whatsapp||'')+'" placeholder="+234..."></div></div><p><button data-a="saveSup">Save contact</button></p></div>'}

A.saveVer=async d=>{const p=d.p,k=p==='an'?'android':'web',o={minVersion:$(p+'_min').value.trim(),latestVersion:$(p+'_lat').value.trim(),message:$(p+'_msg').value.trim()};if(p==='an'){o.updateUrl=$(p+'_url').value.trim();if(o.updateUrl&&!/^https:\/\//i.test(o.updateUrl))return toast('The link must start with https://')}
  if(o.minVersion&&!/^\d+(\.\d+)*$/.test(o.minVersion)||o.latestVersion&&!/^\d+(\.\d+)*$/.test(o.latestVersion))return toast('Versions look like 3.2 or 3.2.1');
  if(o.minVersion&&!confirm('Users on a version below '+o.minVersion+' will be blocked until they update. Continue?'))return;await cfgSet({[k]:o});logA('Version control',k+' '+JSON.stringify(o));toast('Saved')};
A.saveSup=async()=>{await cfgSet({support:{email:$('s_e').value.trim(),whatsapp:$('s_w').value.trim()}});logA('Support contact','updated');toast('Saved')};

/* ---------- broadcast ---------- */
const B={type:'holiday',aud:'all',role:'',id:'bc'+rid(),v:{}};
const BT={holiday:'Holiday / break',assignment:'Assignment',class:'Class slot',term:'Term dates (replaces theirs)',message:'Direct message'};
function bcFields(){const t=B.type,v=B.v,i=(k,l,type,ph)=>'<label>'+l+'</label><input type="'+(type||'text')+'" data-i="bcv" data-k="'+k+'" value="'+esc(v[k]||'')+'" placeholder="'+esc(ph||'')+'">';
  if(t==='holiday')return i('name','Name','text','Mid-semester break')+'<div class="two"><div>'+i('from','From','date')+'</div><div>'+i('to','To','date')+'</div></div>';
  if(t==='assignment')return i('course','Course')+i('title','Title')+i('note','Note')+'<div class="two"><div>'+i('by','Start by','date')+'</div><div>'+i('due','Due','date')+'</div></div>';
  if(t==='class')return i('name','Course name')+'<label>Day</label><select data-i="bcv" data-k="day">'+DAYS.map((d,x)=>'<option value="'+x+'"'+(+v.day===x?' selected':'')+'>'+d+'</option>').join('')+'</select><div class="two"><div>'+i('start','Start','time')+'</div><div>'+i('end','End','time')+'</div></div>'+i('room','Room')+i('teacher','Teacher');
  if(t==='term')return'<div class="two"><div>'+i('from','Semester starts','date')+'</div><div>'+i('to','Semester ends','date')+'</div></div>';
  return i('title','Title')+'<label>Message</label><textarea data-i="bcv" data-k="body">'+esc(v.body||'')+'</textarea>'+i('link','Link (optional)','url','https://')}
function bcTargets(){return S.users.filter(u=>!u.disabled&&(B.aud==='all'||(B.aud==='role'?(u.role||'')===B.role&&B.role:u.platform===B.aud)))}
function bcHtml(){
  return'<h3>Broadcast</h3><p class="mut" style="margin-top:-6px">Push something into many users’ apps at once: a holiday, an assignment, a class, term dates, or a message. It appears on their devices within seconds.</p>'+
   '<div class="panel"><label>What do you want to send?</label><select data-c="bcType">'+Object.keys(BT).map(k=>'<option value="'+k+'"'+(B.type===k?' selected':'')+'>'+BT[k]+'</option>').join('')+'</select>'+
   '<div id="bcF">'+bcFields()+'</div><div class="two"><div><label>To</label><select data-c="bcAud"><option value="all"'+(B.aud==='all'?' selected':'')+'>Everyone</option><option value="android"'+(B.aud==='android'?' selected':'')+'>Android users</option><option value="web"'+(B.aud==='web'?' selected':'')+'>Web users</option><option value="role"'+(B.aud==='role'?' selected':'')+'>Users with a role</option></select></div>'+
   '<div><label>Role</label><input id="bcRole" data-i="bcRole" value="'+esc(B.role)+'" placeholder="only for “users with a role”"></div></div>'+
   '<p class="mut" id="bcCnt" style="margin:12px 0 0">'+bcTargets().length+' active users will receive this.</p><div class="prog" id="bcP" hidden><i id="bcPi"></i></div><p><button id="bcGo" data-a="bcSend">Send now</button></p></div>'}
C.bcType=(d,el)=>{B.type=el.value;B.v={};B.id='bc'+rid();$('bcF').innerHTML=bcFields()};
C.bcAud=(d,el)=>{B.aud=el.value;$('bcCnt').textContent=bcTargets().length+' active users will receive this.'};
C.bcRole=(d,el)=>{B.role=el.value.trim();$('bcCnt').textContent=bcTargets().length+' active users will receive this.'};
C.bcv=(d,el)=>{B.v[el.dataset.k]=el.value.trim()};
A.bcSend=async()=>{
  const v=B.v,t=B.type,T=bcTargets();let item,key;
  if(!T.length)return toast('No users match.');
  if(t==='holiday'){if(!v.name||!v.from||!v.to||v.to<v.from)return toast('Enter a name and a valid date range.');item={id:B.id,name:v.name,from:v.from,to:v.to};key='tth'}
  else if(t==='assignment'){if(!v.course||!v.title)return toast('Course and title are required.');item={id:B.id,course:v.course,title:v.title,note:v.note||'',by:v.by||'',due:v.due||'',done:false,created:Date.now()};key='tas'}
  else if(t==='class'){if(!v.name||!v.start||!v.end||v.end<=v.start)return toast('Enter a name and a valid time range.');item={id:B.id,name:v.name,day:+(v.day||0),start:v.start,end:v.end,room:v.room||'',teacher:v.teacher||'',color:COLORS[0]};key='tt'}
  else if(t==='term'){if(!v.from||!v.to||v.to<v.from)return toast('Enter valid start and end dates.');item={from:v.from,to:v.to};key='ttsem'}
  else{if(!v.title)return toast('Add a title.');if(v.link&&!/^https?:\/\//i.test(v.link))return toast('The link must start with https://')}
  if(!confirm('Send this to '+T.length+' user'+(T.length>1?'s':'')+'?'))return;
  const go=$('bcGo');go.disabled=true;$('bcP').hidden=false;let done=0,ok=0,skip=0,fail=0;
  const one=async u=>{try{
    if(t==='message'){await addDoc(collection(db,'users',u.id,'inbox'),{title:v.title,body:v.body||'',link:v.link||'',linkText:'Open',read:false,createdAt:serverTimestamp(),by:me.email});ok++}
    else if(t==='term'){await put(u.id,key,item);ok++}
    else{const s=await getDoc(doc(db,'users',u.id,'data',key));let arr=[];try{arr=s.exists()?JSON.parse(s.data().v):[]}catch(e){arr=[]}if(!Array.isArray(arr))arr=[];
      if(arr.some(x=>x.id===item.id))skip++;else{arr.push(item);await put(u.id,key,arr);ok++}}}catch(e){fail++}
    done++;$('bcPi').style.width=Math.round(done/T.length*100)+'%'};
  for(let i=0;i<T.length;i+=5)await Promise.all(T.slice(i,i+5).map(one));
  logA('Broadcast '+t,(v.title||v.name||v.course||'')+' → '+ok+' users');toast('Done: '+ok+' sent'+(skip?', '+skip+' already had it':'')+(fail?', '+fail+' failed':''));
  B.id='bc'+rid();go.disabled=false;setTimeout(()=>{$('bcP')&&($('bcP').hidden=true)},1500)};

/* ---------- admins ---------- */
function adminsHtml(){
  return'<h3>Admins</h3><p class="mut" style="margin-top:-6px">People who can sign in to this dashboard. No need to open the Firebase console.</p><div class="bar"><button data-a="admNew">+ Add admin</button></div>'+
   '<div class="panel"><table><tr><th>Admin</th><th>Added by</th><th>Added</th><th></th></tr>'+S.admins.map(a=>'<tr><td>'+esc(a.email||a.id)+(a.id===me.uid?' '+tag('you'):'')+'<div class="mut" style="font-size:.72rem">'+esc(a.id)+'</div></td><td>'+esc(a.addedBy||'console')+'</td><td>'+day(date(a.createdAt))+'</td><td>'+(a.id===me.uid?'':'<button class="d s" data-a="admDel" data-id="'+esc(a.id)+'">Remove</button>')+'</td></tr>').join('')+'</table></div>'}
A.admNew=()=>form('Add admin',[{k:'who',l:'Email of an existing Syllabuzz user, or a UID',req:1,h:'They must have signed in to Syllabuzz (app or web) at least once.'}],{},async r=>{
  const w=r.who.toLowerCase(),u=S.users.find(x=>(x.email||'').toLowerCase()===w||x.id===r.who);if(!u)return'No user found with that email or UID.';
  if(S.admins.some(a=>a.id===u.id))return'They are already an admin.';await setDoc(doc(db,'admins',u.id),{email:u.email||'',addedBy:me.email,createdAt:serverTimestamp()});logA('Added admin',u.email||u.id);toast('Admin added')},'Add admin');
A.admDel=async d=>{if(!confirm('Remove this admin?'))return;await deleteDoc(doc(db,'admins',d.id));logA('Removed admin',(S.admins.find(a=>a.id===d.id)||{}).email||d.id)};

/* ---------- activity ---------- */
function logHtml(){return'<h3>Activity</h3><p class="mut" style="margin-top:-6px">The last 100 admin actions.</p><div class="panel"><table><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr>'+
  (S.log.map(l=>'<tr><td>'+dt(date(l.createdAt))+'</td><td>'+esc(l.by)+'</td><td>'+esc(l.action)+'</td><td class="w">'+esc(l.detail||'')+'</td></tr>').join('')||'<tr><td colspan="4" class="mut">No activity yet</td></tr>')+'</table></div>'}
</script></body></html>
