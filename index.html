<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syllabuzz Dashboard</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#14152a;--mut:#6a6f8a;--line:#e6e8f2;--ac:#6366f1;--ok:#16a34a;--bad:#ef4444;--warn:#d97706;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b0c14;--card:#141624;--tx:#eef0ff;--mut:#9094b3;--line:#232640;--ac:#818cf8;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}button.d{background:var(--bad)}button.s{padding:4px 10px;font-size:.82rem;border-radius:8px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
input[type=color]{padding:2px;height:38px}input[type=checkbox]{width:auto}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;min-height:260px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(100%,380px)}
.box h1{margin:0 0 4px;font-size:1.3rem}.mut{color:var(--mut)}.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav h2{margin:0 8px 14px;font-size:1.1rem}nav button{text-align:left;background:none;color:var(--tx);font-weight:500}
nav button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:700}
nav .sp{flex:1}nav small{margin:4px 8px;color:var(--mut);word-break:break-all}
main{padding:22px;max-width:1100px;width:100%}
h3{margin:0 0 12px;font-size:1.15rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card b{display:block;font-size:1.6rem}.card span{color:var(--mut);font-size:.82rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}tr.row{cursor:pointer}tr.row:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar input,.bar select{width:auto;flex:1;min-width:150px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}.chart div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div i{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:.7rem;font-style:normal;color:var(--mut)}
.lab{display:flex;gap:5px;font-size:.68rem;color:var(--mut)}.lab span{flex:1;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--line)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.head .av{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem;overflow:hidden}.head .av img{width:100%;height:100%;object-fit:cover}
.head .grow{flex:1;min-width:200px}.head h3{margin:0}.acts{display:flex;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);width:min(94vw,460px);padding:20px;max-height:92vh;overflow:auto}
dialog::backdrop{background:#0009}.dacts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.88rem;z-index:99;display:none}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav h2{width:100%}nav .sp{display:none}main{padding:14px}}
</style></head>
<body>
<div id="login" hidden><div class="box"><h1>Syllabuzz Dashboard</h1><p class="mut" style="margin:0 0 14px">Admins only</p>
<button class="g" id="lG" style="width:100%;margin-bottom:12px">Continue with Google</button>
<label>Email</label><input id="lE" type="email" autocomplete="email"><label>Password</label><input id="lP" type="password" autocomplete="current-password">
<p class="err" id="lM"></p><button id="lGo" style="width:100%">Log in</button></div></div>
<div id="app" hidden>
<nav><h2>Syllabuzz</h2><button data-r="overview" class="on">Overview</button><button data-r="users">Users</button><div class="sp"></div><small id="me"></small><button id="out">Log out</button></nav>
<main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp,deleteApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut,createUserWithEmailAndPassword,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,collectionGroup,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const cfg=window.SB_CONFIG.firebase,$=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(/^YOUR_/.test(cfg.apiKey)){document.body.innerHTML='<p style="padding:24px">Fill in <code>firebase-config.js</code> first.</p>';throw 0}
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const KEYS={tt:'Classes',tth:'Holidays',tta:'Attendance marks',ttsem:'Term dates',tas:'Assignments',ttl:'Lecturer contacts',ttk:'Look and theme',ttf:'Preferences',tsh:'Study hub'};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],COLORS=['#4f46e5','#0d9488','#d97706','#dc2626','#9333ea','#2563eb'];
let route='overview',users=[],unU=null,unD=null,sel=null,tab='classes',udata={},gstats=null,q='',fPlat='',fStat='';
const date=t=>t&&t.toDate?t.toDate():null;
const ago=d=>{if(!d)return'never';const s=(Date.now()-d)/1000;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';if(s<86400*30)return Math.round(s/86400)+' d ago';return d.toLocaleDateString()};
const day=d=>d?d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'-';
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function parse(k){const x=udata[k];if(!x)return null;try{return JSON.parse(x.v)}catch(e){return null}}
async function put(uid,k,val){await setDoc(doc(db,'users',uid,'data',k),{v:typeof val==='string'?val:JSON.stringify(val),u:serverTimestamp(),by:'dashboard'})}

/* ---------- login ---------- */
$('lGo').onclick=async()=>{$('lM').textContent='';try{await signInWithEmailAndPassword(auth,$('lE').value.trim(),$('lP').value)}catch(e){$('lM').textContent='Wrong email or password.'}};
$('lG').onclick=async()=>{$('lM').textContent='';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('lM').textContent=e.code||'Sign-in failed'}};
$('out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  if(unU){unU();unU=null}if(unD){unD();unD=null}
  if(!u){$('app').hidden=true;$('login').hidden=false;return}
  let ok=false;try{ok=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){}
  if(!ok){$('app').hidden=true;$('login').hidden=false;$('lM').innerHTML='Not an admin. In Firestore create document <b>admins/'+esc(u.uid)+'</b> (any field), then log in again.';signOut(auth);return}
  $('login').hidden=true;$('app').hidden=false;$('me').textContent=u.email;
  unU=onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(!sel)draw()},e=>toast('Could not load users: '+e.code));
  draw();
});
document.querySelectorAll('nav button[data-r]').forEach(b=>b.onclick=()=>{route=b.dataset.r;closeUser();draw()});

/* ---------- views ---------- */
function draw(){
  document.querySelectorAll('nav button[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===route));
  if(sel)return drawUser();
  $('main').innerHTML=route==='users'?usersHtml():overviewHtml();
  if(route==='users')bindUsers();else bindOverview();
}
function overviewHtml(){
  const now=Date.now(),n=users.length,w=users.filter(u=>date(u.createdAt)&&now-date(u.createdAt)<6048e5).length,
    a24=users.filter(u=>date(u.lastSeen)&&now-date(u.lastSeen)<864e5).length,a7=users.filter(u=>date(u.lastSeen)&&now-date(u.lastSeen)<6048e5).length,
    dis=users.filter(u=>u.disabled).length,pl={};users.forEach(u=>{const p=u.platform||'?';pl[p]=(pl[p]||0)+1});
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}
  const cnt=days.map(d=>users.filter(u=>{const c=date(u.createdAt);return c&&c>=d&&c<new Date(+d+864e5)}).length),mx=Math.max(1,...cnt);
  const g=gstats;
  return'<h3>Overview</h3><div class="cards"><div class="card"><b>'+n+'</b><span>Total users</span></div><div class="card"><b>'+w+'</b><span>New in 7 days</span></div><div class="card"><b>'+a24+'</b><span>Active in 24 h</span></div><div class="card"><b>'+a7+'</b><span>Active in 7 days</span></div><div class="card"><b>'+dis+'</b><span>Disabled</span></div></div>'+
  '<div class="panel"><b>Sign-ups, last 14 days</b><div class="chart" style="margin-top:22px">'+cnt.map(c=>'<div style="height:'+(c/mx*100)+'%"><i>'+(c||'')+'</i></div>').join('')+'</div><div class="lab">'+days.map(d=>'<span>'+d.getDate()+'</span>').join('')+'</div></div>'+
  '<div class="panel"><b>Platforms</b><p style="margin:8px 0 0">'+(Object.keys(pl).map(k=>'<span class="tag" style="margin-right:6px">'+esc(k)+' '+pl[k]+'</span>').join('')||'<span class="mut">No users yet</span>')+'</p></div>'+
  '<div class="panel"><div class="bar" style="margin:0 0 8px"><b style="flex:1">App data across all users</b><button class="g s" id="gs">'+(g?'Refresh':'Load')+'</button></div>'+
  (g?'<div class="cards" style="margin:0"><div class="card"><b>'+g.classes+'</b><span>Class slots</span></div><div class="card"><b>'+g.assign+'</b><span>Assignments ('+g.done+' done)</span></div><div class="card"><b>'+g.users+'</b><span>Users with data</span></div><div class="card"><b>'+g.kb+' KB</b><span>Stored</span></div></div>':'<span class="mut">Reads every user\u2019s data once (uses Firestore reads, so it only runs when you click).</span>')+'</div>';
}
function bindOverview(){const b=$('gs');if(b)b.onclick=async()=>{b.disabled=true;b.textContent='Loading\u2026';try{
  const s=await getDocs(collectionGroup(db,'data')),g={classes:0,assign:0,done:0,users:new Set(),kb:0};
  s.forEach(d=>{const x=d.data();g.users.add(d.ref.parent.parent.id);g.kb+=(x.v||'').length/1024;let v=null;try{v=JSON.parse(x.v)}catch(e){}
    if(d.id==='tt'&&Array.isArray(v))g.classes+=v.length;if(d.id==='tas'&&Array.isArray(v)){g.assign+=v.length;g.done+=v.filter(a=>a.done).length}});
  g.users=g.users.size;g.kb=Math.round(g.kb);gstats=g;draw()}catch(e){toast('Failed: '+e.code);b.disabled=false}}}
function usersHtml(){
  const L=users.filter(u=>(!q||((u.name||'')+(u.email||'')+u.id).toLowerCase().includes(q.toLowerCase()))&&(!fPlat||u.platform===fPlat)&&(!fStat||(fStat==='disabled')===!!u.disabled)).sort((a,b)=>(date(b.lastSeen)||0)-(date(a.lastSeen)||0));
  return'<h3>Users ('+L.length+')</h3><div class="bar"><input id="q" placeholder="Search name, email or UID" value="'+esc(q)+'"><select id="fp" style="max-width:140px"><option value="">All platforms</option><option value="android"'+(fPlat==='android'?' selected':'')+'>Android</option><option value="web"'+(fPlat==='web'?' selected':'')+'>Web</option></select><select id="fs" style="max-width:140px"><option value="">Any status</option><option value="active"'+(fStat==='active'?' selected':'')+'>Active</option><option value="disabled"'+(fStat==='disabled'?' selected':'')+'>Disabled</option></select><button id="add">+ Add user</button></div>'+
  '<div class="panel"><table><tr><th>Name</th><th>Email</th><th>Platform</th><th>Sign-in</th><th>Joined</th><th>Last seen</th><th>Status</th></tr>'+
  L.map(u=>'<tr class="row" data-id="'+esc(u.id)+'"><td>'+esc(u.name||'-')+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.platform||'-')+' '+esc(u.appVersion||'')+'</td><td>'+esc((u.provider||'').replace('.com',''))+'</td><td>'+day(date(u.createdAt))+'</td><td>'+ago(date(u.lastSeen))+'</td><td>'+(u.disabled?'<span class="tag bad">Disabled</span>':'<span class="tag ok">Active</span>')+(u.role?' <span class="tag">'+esc(u.role)+'</span>':'')+'</td></tr>').join('')+
  (L.length?'':'<tr><td colspan="7" class="mut">No users</td></tr>')+'</table></div>';
}
function bindUsers(){
  $('q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;draw();$('q').focus();$('q').setSelectionRange(p,p)};
  $('fp').onchange=e=>{fPlat=e.target.value;draw()};$('fs').onchange=e=>{fStat=e.target.value;draw()};
  $('add').onclick=addUserDlg;document.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>openUser(r.dataset.id));
}
function openUser(id){sel=id;tab='classes';udata={};if(unD)unD();
  unD=onSnapshot(collection(db,'users',id,'data'),s=>{udata={};s.forEach(d=>udata[d.id]=d.data());if(sel===id)drawUser()},e=>toast('Could not load data: '+e.code));drawUser()}
function closeUser(){sel=null;if(unD){unD();unD=null}udata={}}
const cur=()=>users.find(u=>u.id===sel)||{id:sel};
function drawUser(){
  const u=cur(),d=date(u.createdAt);
  let body='';
  if(tab==='classes')body=classesHtml();else if(tab==='assign')body=assignHtml();else body=rawHtml();
  $('main').innerHTML='<p><button class="g s" id="back">\u2190 All users</button></p>'+
  '<div class="head"><div class="av">'+(u.photo?'<img src="'+esc(u.photo)+'" referrerpolicy="no-referrer" alt="">':esc((u.name||u.email||'?').charAt(0).toUpperCase()))+'</div><div class="grow"><h3>'+esc(u.name||u.email||u.id)+' '+(u.disabled?'<span class="tag bad">Disabled</span>':'<span class="tag ok">Active</span>')+'</h3><div class="mut" style="font-size:.85rem">'+esc(u.email||'')+' \u00B7 '+esc(u.platform||'?')+' '+esc(u.appVersion||'')+' \u00B7 joined '+day(d)+' \u00B7 seen '+ago(date(u.lastSeen))+'</div><div class="mut" style="font-size:.74rem">UID '+esc(sel)+'</div></div>'+
  '<div class="acts"><button class="g s" id="ed">Edit profile</button><button class="g s" id="dis">'+(u.disabled?'Enable':'Disable')+'</button><button class="g s" id="ex">Export</button><button class="g s" id="im">Import</button><button class="g s" id="rs">Reset email</button><button class="d s" id="del">Delete</button></div></div>'+
  '<div class="tabs">'+[['classes','Classes'],['assign','Assignments'],['raw','All data']].map(t=>'<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'+body;
  $('back').onclick=()=>{closeUser();draw()};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;drawUser()});
  $('ed').onclick=editProfile;$('dis').onclick=toggleDisable;$('ex').onclick=exportUser;$('im').onclick=importUser;$('rs').onclick=resetMail;$('del').onclick=delUser;
  bindBody();
}
/* ----- classes ----- */
function classesHtml(){
  const L=(parse('tt')||[]).slice().sort((a,b)=>a.day-b.day||String(a.start).localeCompare(String(b.start)));
  return'<div class="panel"><div class="bar" style="margin:0 0 8px"><b style="flex:1">'+L.length+' class slots</b><button id="addc">+ Add class</button></div><table><tr><th>Course</th><th>Day</th><th>Time</th><th>Room</th><th>Teacher</th><th></th></tr>'+
  L.map(c=>'<tr><td><span class="dot" style="background:'+esc(c.color||'#4f46e5')+'"></span>'+esc(c.name)+'</td><td>'+esc(DAYS[c.day]||c.day)+'</td><td>'+esc(c.start)+'\u2013'+esc(c.end)+'</td><td>'+esc(c.room||'')+'</td><td>'+esc(c.teacher||'')+'</td><td><button class="g s" data-ec="'+esc(c.id)+'">Edit</button> <button class="d s" data-dc="'+esc(c.id)+'">Delete</button></td></tr>').join('')+(L.length?'':'<tr><td colspan="6" class="mut">No classes</td></tr>')+'</table></div>';
}
function classDlg(id){
  const all=parse('tt')||[],c=all.find(x=>x.id===id)||{name:'',day:0,start:'08:00',end:'09:00',room:'',teacher:'',color:COLORS[all.length%COLORS.length]};
  dlg('<h3>'+(id?'Edit':'Add')+' class</h3><label>Course name</label><input id="f1" value="'+esc(c.name)+'"><label>Day</label><select id="f2">'+DAYS.map((d,i)=>'<option value="'+i+'"'+(i===c.day?' selected':'')+'>'+d+'</option>').join('')+'</select>'+
  '<div class="two"><div><label>Start</label><input id="f3" type="time" value="'+esc(c.start)+'"></div><div><label>End</label><input id="f4" type="time" value="'+esc(c.end)+'"></div></div>'+
  '<label>Room</label><input id="f5" value="'+esc(c.room||'')+'"><label>Teacher</label><input id="f6" value="'+esc(c.teacher||'')+'"><label>Colour</label><input id="f7" type="color" value="'+esc(c.color||'#4f46e5')+'">',async()=>{
    const o={id:c.id||rid(),name:$('f1').value.trim(),room:$('f5').value.trim(),teacher:$('f6').value.trim(),start:$('f3').value,end:$('f4').value,day:+$('f2').value,color:$('f7').value};
    if(!o.name||!o.start||!o.end||o.end<=o.start)return'Enter a name and a valid time range.';
    await put(sel,'tt',id?all.map(x=>x.id===id?o:x):all.concat([o]));});
}
/* ----- assignments ----- */
function assignHtml(){
  const L=(parse('tas')||[]).slice().sort((a,b)=>String(a.due).localeCompare(String(b.due)));
  return'<div class="panel"><div class="bar" style="margin:0 0 8px"><b style="flex:1">'+L.length+' assignments</b><button id="adda">+ Add assignment</button></div><table><tr><th>Done</th><th>Course</th><th>Title</th><th>Start by</th><th>Due</th><th></th></tr>'+
  L.map(a=>'<tr><td><input type="checkbox" data-tg="'+esc(a.id)+'"'+(a.done?' checked':'')+'></td><td>'+esc(a.course)+'</td><td>'+esc(a.title)+(a.note?'<div class="mut" style="font-size:.78rem">'+esc(a.note)+'</div>':'')+'</td><td>'+esc(a.by||'')+'</td><td>'+esc(a.due||'')+'</td><td><button class="g s" data-ea="'+esc(a.id)+'">Edit</button> <button class="d s" data-da="'+esc(a.id)+'">Delete</button></td></tr>').join('')+(L.length?'':'<tr><td colspan="6" class="mut">No assignments</td></tr>')+'</table></div>';
}
function assignDlg(id){
  const all=parse('tas')||[],a=all.find(x=>x.id===id)||{course:'',title:'',note:'',by:'',due:'',done:false,created:Date.now()};
  dlg('<h3>'+(id?'Edit':'Add')+' assignment</h3><label>Course</label><input id="f1" value="'+esc(a.course)+'"><label>Title</label><input id="f2" value="'+esc(a.title)+'"><label>Note</label><input id="f3" value="'+esc(a.note||'')+'">'+
  '<div class="two"><div><label>Start by</label><input id="f4" type="date" value="'+esc(a.by||'')+'"></div><div><label>Due</label><input id="f5" type="date" value="'+esc(a.due||'')+'"></div></div><label><input id="f6" type="checkbox"'+(a.done?' checked':'')+'> Completed</label>',async()=>{
    const o={id:a.id||rid(),course:$('f1').value.trim(),title:$('f2').value.trim(),note:$('f3').value.trim(),by:$('f4').value,due:$('f5').value,done:$('f6').checked,created:a.created||Date.now()};
    if(!o.course||!o.title)return'Course and title are required.';
    await put(sel,'tas',id?all.map(x=>x.id===id?o:x):all.concat([o]));});
}
/* ----- raw data ----- */
function rawHtml(){
  const rows=Object.keys(KEYS).map(k=>{const x=udata[k],t=x&&date(x.u);return'<tr><td><b>'+esc(KEYS[k])+'</b> <span class="mut">'+k+'</span></td><td>'+(x?Math.round(x.v.length/102.4)/10+' KB':'<span class="mut">empty</span>')+'</td><td>'+(x?esc(x.by||'')+' \u00B7 '+ago(t):'')+'</td><td><button class="g s" data-er="'+k+'">'+(x?'Edit JSON':'Create')+'</button>'+(x?' <button class="d s" data-dr="'+k+'">Delete</button>':'')+'</td></tr>'}).join('');
  return'<div class="panel"><table><tr><th>Data</th><th>Size</th><th>Last write</th><th></th></tr>'+rows+'</table></div>';
}
function rawDlg(k){
  let t=udata[k]?udata[k].v:(k==='tt'||k==='tth'||k==='tas'?'[]':'{}');try{t=JSON.stringify(JSON.parse(t),null,2)}catch(e){}
  dlg('<h3>'+esc(KEYS[k])+' <span class="mut">('+k+')</span></h3><textarea id="f1" spellcheck="false">'+esc(t)+'</textarea>',async()=>{
    let v;try{v=JSON.parse($('f1').value)}catch(e){return'That is not valid JSON.'}
    if((k==='tt'||k==='tth'||k==='tas')&&!Array.isArray(v))return'This one must be a list [ ].';
    if(k!=='tt'&&k!=='tth'&&k!=='tas'&&(v===null||typeof v!=='object'||Array.isArray(v)))return'This one must be an object { }.';
    await put(sel,k,v);});
}
function bindBody(){
  const on=(a,f)=>document.querySelectorAll('['+a+']').forEach(e=>e.onclick=()=>f(e.getAttribute(a)));
  const A=$('addc');if(A)A.onclick=()=>classDlg();const B=$('adda');if(B)B.onclick=()=>assignDlg();
  on('data-ec',classDlg);on('data-ea',assignDlg);on('data-er',rawDlg);
  on('data-dc',async id=>{if(confirm('Delete this class slot?'))await put(sel,'tt',(parse('tt')||[]).filter(x=>x.id!==id)).then(()=>toast('Deleted'))});
  on('data-da',async id=>{if(confirm('Delete this assignment?'))await put(sel,'tas',(parse('tas')||[]).filter(x=>x.id!==id)).then(()=>toast('Deleted'))});
  on('data-dr',async k=>{if(confirm('Delete '+KEYS[k]+' for this user? Their app will clear it too.'))await deleteDoc(doc(db,'users',sel,'data',k)).then(()=>toast('Deleted'))});
  document.querySelectorAll('[data-tg]').forEach(e=>e.onchange=()=>put(sel,'tas',(parse('tas')||[]).map(x=>x.id===e.dataset.tg?Object.assign({},x,{done:e.checked}):x)));
}
/* ----- user actions ----- */
function editProfile(){const u=cur();dlg('<h3>Edit profile</h3><label>Name</label><input id="f1" value="'+esc(u.name||'')+'"><label>Role / label</label><input id="f2" value="'+esc(u.role||'')+'" placeholder="e.g. tester"><label>Admin notes</label><textarea id="f3" style="min-height:90px;font-family:inherit">'+esc(u.notes||'')+'</textarea>',async()=>{
  await updateDoc(doc(db,'users',sel),{name:$('f1').value.trim(),role:$('f2').value.trim(),notes:$('f3').value.trim()})})}
async function toggleDisable(){const u=cur(),d=!u.disabled;if(!confirm(d?'Disable this account? They are signed out of the app and cannot sync.':'Enable this account again?'))return;await updateDoc(doc(db,'users',sel),{disabled:d});toast(d?'Disabled':'Enabled')}
function exportUser(){const d={};Object.keys(udata).forEach(k=>d[k]=udata[k].v);
  const b=new Blob([JSON.stringify({app:'syllabuzz',version:1,exported:new Date().toISOString(),data:d},null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='syllabuzz-'+(cur().email||sel)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function importUser(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{
  const o=JSON.parse(await i.files[0].text());if(o.app!=='syllabuzz'||!o.data)throw 0;
  const ks=Object.keys(o.data).filter(k=>KEYS[k]&&typeof o.data[k]==='string');if(!ks.length)throw 0;
  if(!confirm('Replace '+ks.length+' data sets for this user with the file?'))return;for(const k of ks)await put(sel,k,o.data[k]);toast('Imported')}catch(e){toast('Not a valid Syllabuzz backup')}};i.click()}
async function resetMail(){const e=cur().email;if(!e||!confirm('Send a password reset email to '+e+'?'))return;try{await sendPasswordResetEmail(auth,e);toast('Reset email sent')}catch(x){toast(x.code)}}
async function delUser(){
  if(!confirm('Delete this user\u2019s profile and ALL their cloud data?\n\nTheir login (Firebase Authentication) is NOT removed from here; delete it in the Firebase console too, or use Disable to just block them.'))return;
  try{const s=await getDocs(collection(db,'users',sel,'data'));const b=writeBatch(db);s.forEach(d=>b.delete(d.ref));b.delete(doc(db,'users',sel));await b.commit();toast('Deleted');closeUser();draw()}catch(e){toast('Failed: '+e.code)}
}
function addUserDlg(){
  dlg('<h3>Add user</h3><p class="mut" style="margin:0">Creates a login they can use in the app or web app.</p><label>Name</label><input id="f1"><label>Email</label><input id="f2" type="email"><label>Temporary password (6+ characters)</label><input id="f3" type="text">',async()=>{
    const n=$('f1').value.trim(),e=$('f2').value.trim(),p=$('f3').value;if(!n||!e||p.length<6)return'Fill in every field (password 6+ characters).';
    const sec=initializeApp(cfg,'sec'+Date.now());try{
      const r=await createUserWithEmailAndPassword(getAuth(sec),e,p);
      await setDoc(doc(db,'users',r.user.uid),{name:n,email:e,photo:'',provider:'password',platform:'dashboard',appVersion:'',createdAt:serverTimestamp(),lastSeen:null});
      toast('User created')}catch(x){return x.code==='auth/email-already-in-use'?'That email already has an account.':(x.code||'Failed')}finally{await deleteApp(sec)}});
}
/* ----- generic dialog ----- */
function dlg(html,onSave){
  const d=$('dlg');d.innerHTML=html+'<p class="err" id="dm"></p><div class="dacts"><button class="g" id="dc">Cancel</button><button id="ds">Save</button></div>';
  $('dc').onclick=()=>d.close();
  $('ds').onclick=async()=>{$('ds').disabled=true;try{const r=await onSave();if(r){$('dm').textContent=r;$('ds').disabled=false;return}d.close()}catch(e){$('dm').textContent=e.code||String(e);$('ds').disabled=false}};
  d.showModal();
}
</script></body></html>
