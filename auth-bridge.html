<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syllabuzz · Google sign-in</title>
<style>body{font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f6fb;color:#14152a;text-align:center;padding:24px}
@media(prefers-color-scheme:dark){body{background:#0b0c14;color:#eef0ff}}a{color:#6366f1}</style></head>
<body><div><h2>Syllabuzz</h2><p id="m">Opening Google sign-in…</p><p><a id="back" href="#" hidden>Return to the app</a></p></div>
<script src="firebase-config.js"></script>
<script type="module">
/* Used only by the Android app: signs in with Google in the real browser (Google blocks
   sign-in inside embedded WebViews) and hands the Google ID token back to the app. */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const m=document.getElementById('m');
const q=new URLSearchParams(location.search);
let state=q.get('state')||'';
if(state){try{sessionStorage.setItem('sb_state',state)}catch(e){}}else{try{state=sessionStorage.getItem('sb_state')||''}catch(e){}}
const auth=getAuth(initializeApp(window.SB_CONFIG.firebase));
const provider=new GoogleAuthProvider();
function back(idToken){
  m.textContent='Returning to Syllabuzz…';
  const u='syllabuzz://auth?idToken='+encodeURIComponent(idToken)+'&state='+encodeURIComponent(state);
  const a=document.getElementById('back');a.href=u;a.hidden=false;
  location.href=u;
}
function fail(e){m.textContent='Sign-in failed: '+((e&&e.code)||e)+'. Close this tab and try again in the app.'}
(async()=>{
  try{
    let r=await getRedirectResult(auth);
    if(!r){
      try{r=await signInWithPopup(auth,provider)}
      catch(e){
        if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){await signInWithRedirect(auth,provider);return}
        throw e;
      }
    }
    const c=GoogleAuthProvider.credentialFromResult(r);
    if(!c||!c.idToken)throw new Error('no token');
    back(c.idToken);
  }catch(e){fail(e)}
})();
</script></body></html>
